<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SereneMind Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58876c;
            --primary-hover: #4a745c;
            --bg-body: #f4f9f6;
            --bg-left: #f0f7f3;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .bg-pot {
            position: fixed; bottom: 0; left: 0;
            width: 15vw; max-width: 180px; z-index: 1;
            object-fit: contain; transform: translateX(-15%);
            mix-blend-mode: multiply;
        }
        .bg-plants {
            position: fixed; top: 0; right: 0;
            height: 75vh; max-height: 800px; z-index: 1;
            object-fit: contain; transform: translateX(10%);
            mix-blend-mode: multiply;
        }
        .login-card {
            width: 900px; height: 600px;
            background: #ffffff; border-radius: 20px;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.08);
            display: flex; z-index: 10; position: relative;
        }
        .left-panel {
            width: 420px; background-color: var(--bg-left);
            border-top-left-radius: 20px; border-bottom-left-radius: 20px;
            position: relative; display: flex; flex-direction: column;
            align-items: center; padding-top: 50px; overflow: hidden;
        }
        .logo { width: 220px; height: auto; margin-bottom: 8px; }
        .left-panel h3 {
            font-size: 14px; font-weight: 500; color: var(--text-dark);
            text-align: center; line-height: 1.5; margin-bottom: 25px;
        }
        .illustration { width: 280px; height: auto; z-index: 5; mix-blend-mode: multiply; }
        .bottom-curve {
            position: absolute; bottom: -20px; left: -10%;
            width: 120%; height: 120px; background-color: #ffffff;
            border-top-left-radius: 50%; border-top-right-radius: 50%; z-index: 2;
        }
        .trust-badge {
            position: absolute; bottom: 30px;
            display: flex; align-items: center; gap: 12px; z-index: 5;
        }
        .trust-badge svg { width: 20px; height: 20px; fill: var(--primary); }
        .trust-badge p { font-size: 13px; color: var(--text-dark); line-height: 1.4; font-weight: 500; }
        .right-panel { flex: 1; padding: 55px 70px; display: flex; flex-direction: column; justify-content: center; }
        .right-panel h2 { font-size: 26px; font-weight: 600; color: var(--text-dark); text-align: center; margin-bottom: 6px; }
        .right-panel > p { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-bottom: 35px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper svg.left-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: #94a3b8; }
        .input-wrapper input { width: 100%; height: 46px; border: 1px solid var(--border-color); border-radius: 8px; padding-left: 44px; padding-right: 44px; font-size: 14px; color: var(--text-dark); outline: none; transition: border-color 0.2s; }
        .input-wrapper input::placeholder { color: #94a3b8; font-weight: 400; }
        .input-wrapper input:focus { border-color: var(--primary); }
        .toggle-password { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; width: 18px; height: 18px; fill: #94a3b8; }
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .remember-me input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        .remember-me span { font-size: 13px; color: var(--text-dark); font-weight: 500; }
        .forgot-pass { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; }
        .forgot-pass:hover { text-decoration: underline; }
        .login-btn { width: 100%; height: 46px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
        .login-btn:hover { background-color: var(--primary-hover); }
        .divider { display: flex; align-items: center; margin: 22px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background-color: var(--border-color); }
        .divider span { padding: 0 14px; font-size: 13px; color: #94a3b8; }
        .google-btn { width: 100%; height: 46px; background-color: white; border: 1px solid var(--border-color); border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text-dark); cursor: pointer; transition: background-color 0.2s; }
        .google-btn:hover { background-color: #f8fafc; }
        .google-btn svg { width: 18px; height: 18px; }
        .signup-text { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); }
        .signup-text a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .signup-text a:hover { text-decoration: underline; }
    </style>
</head>
