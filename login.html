<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SereneMind Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58876c;
            --primary-hover: #4a745c;
            --bg-body: #f4f9f6;
            --bg-left: #f0f7f3;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .bg-pot {
            position: fixed; 
            bottom: -10px; 
            left: -150px;   
            height: 300px; 
            width: auto;   
            z-index: 1;    
            pointer-events: none; 
        }
        .bg-plants {
            position: fixed; top: 0; right: 0;
            height: 75vh; max-height: 800px; z-index: 1;
            object-fit: contain; transform: translateX(10%);
            mix-blend-mode: multiply;
        }
        .login-card {
            width: 900px; height: 600px;
            background: #ffffff; border-radius: 20px;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.08);
            display: flex; z-index: 10; position: relative;
        }
        .left-panel {
            width: 420px; background-color: var(--bg-left);
            border-top-left-radius: 20px; border-bottom-left-radius: 20px;
            position: relative; display: flex; flex-direction: column;
            align-items: center; padding-top: 50px; overflow: hidden;
        }
        .logo { width: 220px; height: auto; margin-bottom: 8px; }
        .left-panel h3 {
            font-size: 14px; font-weight: 500; color: var(--text-dark);
            text-align: center; line-height: 1.5; margin-bottom: 25px;
            padding: 0 20px;
        }
         .illustration { 
            width: 250px; 
            height: auto; 
            margin-top: 20px; 
            mix-blend-mode: multiply; 
        }
        .trust-badge {
            position: absolute; bottom: 30px;
            display: flex; align-items: center; gap: 12px; z-index: 5;
        }
        .trust-badge svg { width: 20px; height: 20px; fill: var(--primary); }
        .trust-badge p { font-size: 13px; color: var(--text-dark); line-height: 1.4; font-weight: 500; }
        
        .right-panel { flex: 1; padding: 55px 70px; display: flex; flex-direction: column; justify-content: center; }
        .right-panel h2 { font-size: 26px; font-weight: 600; color: var(--text-dark); text-align: center; margin-bottom: 6px; }
        .right-panel > p { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-bottom: 35px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .input-wrapper { position: relative; width: 100%; }
        
        .input-wrapper svg.left-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: #94a3b8; }
        .input-wrapper input { width: 100%; height: 46px; border: 1px solid var(--border-color); border-radius: 8px; padding-left: 44px; padding-right: 44px; font-size: 14px; color: var(--text-dark); outline: none; transition: border-color 0.2s; }
        .input-wrapper input::placeholder { color: #94a3b8; font-weight: 400; }
        .input-wrapper input:focus { border-color: var(--primary); }
        
        .toggle-password { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; width: 18px; height: 18px; fill: #94a3b8; }
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .remember-me input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        .remember-me span { font-size: 13px; color: var(--text-dark); font-weight: 500; }
        .forgot-pass { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; }
        .forgot-pass:hover { text-decoration: underline; }
        
        .login-btn { width: 100%; height: 46px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
        .login-btn:hover { background-color: var(--primary-hover); }
        
        .divider { display: flex; align-items: center; margin: 22px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background-color: var(--border-color); }
        .divider span { padding: 0 14px; font-size: 13px; color: #94a3b8; }
        
        .google-btn { width: 100%; height: 46px; background-color: white; border: 1px solid var(--border-color); border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text-dark); cursor: pointer; transition: background-color 0.2s; }
        .google-btn:hover { background-color: #f8fafc; }
        .google-btn svg { width: 18px; height: 18px; }
        
        .signup-text { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); }
        .signup-text a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .signup-text a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .login-card { width: 90%; height: auto; flex-direction: column; }
            .left-panel { display: none; }
            .right-panel { padding: 40px 30px; }
            .bg-pot, .bg-plants { display: none; }
        }
    </style>
</head>
<body>
    <img src="pot.png" class="bg-pot" alt="Background pot">
    
    <div class="login-card">
        <div class="left-panel">
            <div class="logo">
                <img src="logo2.png" class="logo" alt="SereneMind Logo">
            </div>
            <h3>Your personal space for mental well-being and clarity.</h3>
            
            <img src="meditation.png" class="illustration" alt="Meditation Illustration">

            <div class="bottom-curve"></div>
            
            <div class="trust-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
                <p>End-to-end encrypted<br>and 100% private</p>
            </div>
        </div>

        <div class="right-panel">
            <h2>Welcome Back</h2>
            <p>We're glad to see you again. Take a deep breath and log in.</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="left-icon" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        <input type="email" id="email" placeholder="abisha@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="left-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <svg class="toggle-password" id="togglePassword" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
                
                <div class="divider">
                    <span>OR</span>
                </div>

                <button type="button" class="google-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-.14 2.5-.94 3.53v2.93h1.51c4.95-4.56 7.48-10.74 7.48-16.31z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.93l-3.88-3.01c-1.08.72-2.47 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.97H1.64v3.03C3.62 21.24 7.56 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.25 14.24c-.25-.72-.39-1.49-.39-2.24s.14-1.52.39-2.24V6.73H1.64C.6 8.81 0 11.14 0 12.5s.6 3.69 1.64 5.77l3.61-3.03z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.96 1.19 15.24 0 12 0 7.56 0 3.62 2.76 1.64 6.73l3.61 3.03c.95-2.85 3.61-4.97 6.75-4.97z"/>
                    </svg>
                    Continue with Google
                </button>
            </form>

            <div class="signup-text">
                Don't have an account? <a href="http://localhost:5000/api/signup">Sign up</a>
            </div>
        </div>
    </div>

    <img src="plants.png" class="bg-plants" alt="Background plants">
    
    <script>
        
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.style.fill = type === 'text' ? 'var(--primary)' : '#94a3b8';
        });

        
        const loginForm = document.querySelector('#loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.querySelector('#email').value;
            const password = document.querySelector('#password').value;

            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Login successful!');
                } else {
                    alert('Login failed: ' + (data.message || 'Invalid credentials'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Server error, please try again later.');
            }
        });
    </script>
</body>
</html>
